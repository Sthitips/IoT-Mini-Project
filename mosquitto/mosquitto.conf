# ==========================================
# Mosquitto MQTT Broker Configuration
# ==========================================

# Listen on port 1883 on all network interfaces (allows ESP32 on Wi-Fi to connect)
listener 1883 0.0.0.0

# Allow anonymous connections without username/password for local development
allow_anonymous true

# Logging settings
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
